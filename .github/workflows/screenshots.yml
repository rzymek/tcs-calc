name: Screenshots
on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: "screenshots"
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup 🔧
        run: |
          npm i -g pnpm
          pnpm i
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-color-emoji
      - name: Update screenshots 📸
        run: pnpm test:screenshots -u
      - name: Create screenshot-update PR
        uses: peter-evans/create-pull-request@v7
        with:
          branch: screenshot-update
          add-paths: src/__screenshots__/**
          commit-message: "chore: update screenshots"
          title: "Update screenshots"
          body: "Screenshots changed after ${{ github.sha }}. Review the image diffs, merge if intended."
          delete-branch: true
